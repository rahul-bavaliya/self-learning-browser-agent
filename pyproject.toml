[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slba"
version = "0.0.1"
description = "Self-Learning Browser Agent: a Playwright agent for Chrome/Edge with site memory, a skill library, LoRA consolidation and a provenance ledger."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rahul" }]
license = { text = "MIT" }
dependencies = [
    "playwright>=1.48,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "redis>=5.0,<7",
    "httpx>=0.27,<1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]
# Added in later phases; listed here so the plan is visible, not installed now.
# consolidation = ["torch", "transformers", "trl", "peft", "datasets"]
# workers = ["celery>=5.4"]

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "memory",
    "skills",
    "provenance",
    "safety",
    "consolidation",
    "evals",
    "api",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", "infra"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "S",       # bandit (security)
    "ANN",     # type annotations
    "D",       # docstrings
    "RUF",
]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["dashboard/", "infra/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "smoke: launches real browsers (Chrome/Edge); slower",
    "integration: needs docker compose services running",
]
